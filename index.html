<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>HomeWorks</title>
</head>
<body>

<header class="header">
    <img src="assets/images/homeWorks.png" alt="Logo" class="logo">
</header>
<main class="main">
    <section class="main__form">
        <div class="form-reg">
            <h2 class="form-reg__headline">Get your free account</h2>
            <p class="form-reg__text">Try homeWorks BUSINESS free for 15 days. Downgrade to Basic (Free Forever) anytime.</p>
            <form action="#" class="form-reg__form">
                <label class="label-write" id="label-fullName">
                    <span class="label-text">Full Name</span>
                    <input type="text" class="form-reg__input" id="fullName">
                </label>
                <label class="label-write">
                    <span class="label-text">Your username</span>
                    <input type="text" class="form-reg__input" id="username">
                </label>
                <label class="label-write" id="label-email">
                    <span class="label-text">E-mail</span>
                    <input type="email" class="form-reg__input" id="email">
                </label>
                <label class="label-write">
                    <span class="label-text">Password</span>
                    <input type="password" class="form-reg__input" id="password">
                </label>
                <label class="label-write" id="label-passwordRepeat">
                    <span class="label-text">Repeat Password</span>
                    <input type="password" class="form-reg__input" id="passwordRepeat">
                </label>
                <label class="label-privacy">
                    <input type="checkbox" id="checkbox">Agree to our Terms of Service and Privacy Statement
                </label>
                <button class="button" id="button">Sign up</button>
            </form>
            <a href="#" class="form-reg__link" id="link">
                <p>Already have an account?</p>
            </a>
        </div>
    </section>
    <div class="main__image">
        <img src="assets/images/image-2.png" alt="rocket">
    </div>
    <div class="overlay" id="overlay">
        <div class="popup">
            <p class="popup__text">На вашу почту выслана ссылка, перейдите по ней, чтобы завершить регистрацию</p>
            <button class="popup__btn" id="login">ОК</button>
        </div>
    </div>
</main>

<script src="scripts/script.js"></script>
</body>
</html>
